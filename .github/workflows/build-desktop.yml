name: Build desktop

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:
    inputs:
      store:
        description: 'Microsoft Store paketi (.appx) ham yigʻilsinmi?'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Activation tests
        run: npm test

      - name: Check Telegram secret
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error title=TELEGRAM_BOT_TOKEN yoʻq::Repository Settings → Secrets and variables → Actions → New repository secret: TELEGRAM_BOT_TOKEN (va ixtiyoriy TELEGRAM_CHAT_ID). Keyin bu workflowni qayta ishga tushiring."
            exit 1
          fi

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8795480827' }}
          # Windows code signing: added automatically when these secrets exist
          # (WIN_CSC_LINK = base64 of the .pfx certificate). Without them the build is unsigned.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Microsoft Store package
        if: matrix.name == 'windows' && inputs.store
        shell: bash
        env:
          ID_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if [ -z "$ID_NAME" ] || [ -z "$PUBLISHER" ] || [ -z "$PUBLISHER_NAME" ]; then
            echo "::error title=Store maʼlumotlari yoʻq::Settings → Secrets and variables → Actions → Variables: MS_STORE_IDENTITY_NAME, MS_STORE_PUBLISHER, MS_STORE_PUBLISHER_DISPLAY_NAME (Partner Center → Product identity)."
            exit 1
          fi
          npx electron-builder --win appx --publish never \
            -c.appx.identityName="$ID_NAME" \
            -c.appx.publisher="$PUBLISHER" \
            -c.appx.publisherDisplayName="$PUBLISHER_NAME"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: icpc-yoli-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.appx
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
