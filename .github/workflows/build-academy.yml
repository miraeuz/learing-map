name: Build Mirae Academy

on:
  push:
    paths:
      - 'academy/**'
      - '.github/workflows/build-academy.yml'
  workflow_dispatch:

jobs:
  content:
    name: Verify course content
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run every lesson example and check every exercise
        run: python3 content/build.py

  build:
    needs: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: academy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: academy/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Activation tests
        run: npm test

      - name: Check Telegram secret
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error title=TELEGRAM_BOT_TOKEN yoʻq::Repository Settings → Secrets and variables → Actions → New repository secret: TELEGRAM_BOT_TOKEN (va ixtiyoriy TELEGRAM_CHAT_ID). Keyin bu workflowni qayta ishga tushiring."
            exit 1
          fi

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8795480827' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mirae-academy-${{ matrix.name }}
          path: |
            academy/release/*.exe
            academy/release/*.dmg
            academy/release/*.AppImage
            academy/release/*.deb
          if-no-files-found: error
