name: Build APK

on:
  push:
    paths-ignore:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name icpc_quest --org com.icpcquest .

      - name: Patch Android manifest (app name, open links)
        run: python3 tool/patch_android.py android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: |
          dart analyze --format=machine > analyze.txt 2>&1 || true
          python3 tool/analyze_annotate.py analyze.txt

      - name: Run tests
        run: |
          if ! flutter test > test.txt 2>&1; then
            python3 -c "import sys; t=open('test.txt',errors='replace').read()[-6000:]; print('::error title=flutter test::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ICPC-yoli.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: icpc-yoli-apk
          path: build/app/outputs/flutter-apk/ICPC-yoli.apk
